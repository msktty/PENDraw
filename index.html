<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PENDraw - Simple Image Editor (修正版)</title>
<!-- 外部依存: Fabric.js 5.3.0 / qrcodejs 1.0.0。現状はCDN読込のため起動時に通信が必要。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  /* ======================== RESET & BASE ======================== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #09090b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
  }

  /* ======================== CANVAS STAGE ======================== */
  #viewportContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #141416;
    z-index: 10;
  }

  #canvasStage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    width: 1600px;
    height: 2200px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }

  #paintLayersContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .layer-canvas {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  #fabricLayerWrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 100;
    pointer-events: auto;
  }

  /* ======================== UI CONTROLS ======================== */
  /* ④ メニューバー二段化 flex-wrap対応とスマホ幅対応の最適化 */
  .top-bar {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 1000;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    background: rgba(20, 20, 25, 0.88);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 8px 14px;
    border: 0.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .top-bar-section {
    display: flex;
    gap: 6px;
    width: 100%;
    justify-content: space-between;
  }
  .top-bar-section.bottom-section {
    border-top: 0.5px solid rgba(255,255,255,0.1);
    padding-top: 6px;
    margin-top: 2px;
  }
  .project-status {
    color: #a1a1aa;
    font-size: 10px;
    width: 100%;
    text-align: right;
    padding: 0 5px;
  }
  .project-status.dirty { color: #fbbf24; }

  .top-btn {
    background: transparent;
    border: none;
    color: #f4f4f5;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 32px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex: 1;
    justify-content: center;
  }
  .top-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.95); }
  
  /* レイヤーボタン右寄せ対応 */
  .top-btn.layer-toggle-btn {
    background: rgba(0, 255, 102, 0.1);
    color: #00ff66;
    font-weight: bold;
  }

  .bottom-toolbar {
    position: fixed;
    left: 50%;
    bottom: 130px;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    background: rgba(20, 20, 25, 0.88);
    backdrop-filter: blur(20px);
    padding: 6px 12px;
    border-radius: 32px;
    border: 0.5px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    touch-action: none;
    pointer-events: auto;
  }

  .toolbar-handle {
    cursor: move;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    padding: 0 4px 0 2px;
    user-select: none;
    touch-action: none;
  }

  .tool-icon {
    width: 42px;
    height: 42px;
    background: rgba(35,35,40,0.7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #d4d4d8;
    cursor: pointer;
    border: none;
    transition: all 0.15s ease;
  }
  .tool-icon:active { transform: scale(0.9); }
  .tool-icon.active { background: #00ff66; color: #09090b; box-shadow: 0 0 14px rgba(0,255,102,0.5); font-weight: bold; }

  /* SUB CONTEXT MENU (BRUSH SIZE ETC) */
  .sub-context-menu {
    position: fixed;
    background: rgba(24,24,27,0.95);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 1005;
    border: 0.5px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .sub-context-item {
    padding: 8px 14px;
    border-radius: 14px;
    color: #f4f4f5;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }
  .sub-context-item:active { background: rgba(0,255,102,0.2); color: #00ff66; }
  .sub-context-item.active { background: #00ff66; color: #09090b; font-weight: bold; }

  /* FLOATING PANELS */
  .floating-panel {
    position: fixed;
    z-index: 950;
    background: rgba(22, 22, 26, 0.9);
    backdrop-filter: blur(20px);
    border: 0.5px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    pointer-events: auto;
  }

  .panel-handle {
    cursor: move;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    background: rgba(255,255,255,0.05);
  }

  #movablePalette {
    bottom: 16px;
    left: 16px;
    border-radius: 24px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #movablePalette .panel-handle { width: 14px; height: 30px; border-radius: 6px; writing-mode: vertical-lr; letter-spacing: -1px; }

  .current-color-large { display: none; }
  
  .palette-scroll { 
    display: flex; 
    gap: 6px; 
    overflow-x: auto; 
    width: calc(100vw - 140px);
    -webkit-overflow-scrolling: touch; 
  }
  .palette-swatch { 
    width: 26px; 
    height: 26px; 
    border-radius: 50%; 
    flex-shrink: 0; 
    cursor: pointer; 
    border: 1px solid rgba(255,255,255,0.2); 
  }
  .native-picker { width: 28px; height: 28px; border-radius: 50%; background: #27272a; border: 1px solid #444; cursor: pointer; flex-shrink: 0; }

  #movableDpad { right: 16px; bottom: 64px; border-radius: 24px; padding: 6px; width: 124px; display: flex; flex-direction: column; gap: 4px; }
  #movableDpad .panel-handle { height: 12px; width: 100%; border-radius: 6px; }
  .dpad-grid { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 4px; justify-content: center; }
  .dpad-btn { background: rgba(255,255,255,0.06); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #e4e4e7; cursor: pointer; }
  .dpad-btn:active { background: #00ff66; color: #09090b; font-weight: bold; }
  .dpad-btn.center-btn { background: rgba(0,255,102,0.15); color: #00ff66; font-size: 10px; }

  /* SUBMENU & MODAL */
  .submenu {
    position: fixed;
    background: rgba(24,24,27,0.98);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 2000;
    border: 0.5px solid rgba(255,255,255,0.15);
    box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    min-width: 190px;
  }
  .submenu-item { padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 14px; color: #f4f4f5; font-size: 13px; cursor: pointer; }
  .submenu-item:active { background: rgba(0,255,102,0.2); color: #00ff66; }
  .submenu-item.danger { color: #ff453a; background: rgba(255,69,58,0.1); font-weight: bold; }
  .submenu-item.danger:active { background: #ff453a; color: #fff; }

  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); backdrop-filter:blur(10px); z-index:3000; display:none; align-items:center; justify-content:center; }
  .modal-overlay.active { display: flex; }
  .modal-card { background: #18181b; border-radius: 28px; width: 320px; padding: 22px; border: 0.5px solid rgba(255,255,255,0.12); text-align: center; color: #fff; }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #fff; }
  .modal-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .modal-btn { background: #27272a; border: 1px solid #3f3f46; padding: 10px; border-radius: 16px; color: #fff; font-size: 12px; cursor: pointer; }
  .modal-btn:active { background: #3f3f46; }
  .modal-btn.preset-selected {
    background: #064e3b;
    border: 2px solid #00ff66;
    color: #ffffff;
    font-weight: 800;
    box-shadow: 0 0 0 2px rgba(0,255,102,.18);
  }
  .modal-btn.preset-selected::before { content: "✓ "; color: #00ff66; }
  #canvasSizeStatus {
    grid-column: 1 / -1;
    padding: 7px 10px;
    border-radius: 8px;
    background: #18181b;
    color: #a1a1aa;
    font-size: 12px;
    text-align: center;
  }
  #canvasSizeStatus strong { color: #00ff66; }
  .modal-input { width: 100%; padding: 10px; background: #27272a; border: none; border-radius: 16px; color: #fff; text-align: center; margin-bottom: 12px; font-size: 14px; }
  .modal-btn.primary { background: #00ff66; color: #09090b; font-weight: bold; grid-column: span 2; padding: 12px; }
  .modal-btn.cancel { background: #3f3f46; grid-column: span 2; margin-top: 4px; }

  /* TEXT DESIGN MODAL */
  #textEditModal .modal-card {
    width: 90%;
    max-width: 360px;
    padding: 20px;
  }
  .modal-textarea {
    width: 100%;
    height: 90px;
    background: #141416;
    border: 1px solid #3f3f46;
    border-radius: 14px;
    color: #fff;
    padding: 10px;
    font-size: 16px;
    resize: none;
    margin-bottom: 14px;
    outline: none;
  }
  .modal-textarea:focus { border-color: #00ff66; }
  .text-edit-hint {
    color: #a1a1aa;
    font-size: 11px;
    line-height: 1.5;
    margin: -5px 0 12px;
    text-align: left;
  }
  .font-selector-wrapper {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    overflow-x: auto;
  }
  .font-btn {
    flex: 1;
    padding: 8px 4px;
    background: #27272a;
    border: 1px solid transparent;
    border-radius: 10px;
    color: #d4d4d8;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .font-btn.active {
    background: rgba(0,255,102,0.15);
    border-color: #00ff66;
    color: #00ff66;
    font-weight: bold;
  }
  .size-picker-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .size-step-btn {
    width: 36px;
    height: 36px;
    background: #27272a;
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }
  .size-step-btn:active { background: #3f3f46; }
  .size-display { font-size: 15px; font-weight: 600; min-width: 50px; }
  .checkbox-settings-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .toggle-lbl {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .toggle-lbl input { accent-color: #00ff66; transform: scale(1.1); }

  /* TEXT OBJECT CONTEXT HUD */
  .text-hud {
    position: fixed;
    bottom: 190px; 
    left: 50%;
    transform: translateX(-50%);
    z-index: 1200;
    background: rgba(20, 20, 25, 0.95);
    backdrop-filter: blur(24px);
    border: 0.5px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    pointer-events: auto;
    max-width: 94%;
    overflow-x: auto;
  }
  .hud-btn {
    background: rgba(255,255,255,0.06);
    border: none;
    color: #f4f4f5;
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hud-scale-control {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #f4f4f5;
    font-size: 12px;
    white-space: nowrap;
    padding: 3px 5px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
  }
  .hud-scale-control input {
    width: 58px;
    min-width: 58px;
    box-sizing: border-box;
    padding: 6px 4px;
    border: 1px solid #52525b;
    border-radius: 7px;
    background: #09090b;
    color: #fff;
    text-align: right;
    font-size: 14px;
  }
  .hud-scale-control .hud-btn { padding: 6px 9px; }
  .hud-btn:active { background: rgba(0,255,102,0.2); color: #00ff66; }
  .hud-btn.active { background: #00ff66; color: #09090b; font-weight: bold; }
  .hud-btn.danger { color: #ff453a; background: rgba(255,69,58,0.1); }
  .hud-btn.danger:active { background: #ff453a; color: #fff; }

  /* LAYER DRAWER */
  .layer-drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: 320px;
    height: 100%;
    background: rgba(18,18,22,0.96);
    backdrop-filter: blur(24px);
    z-index: 1500;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    display: flex;
    flex-direction: column;
    border-left: 0.5px solid rgba(255,255,255,0.1);
    color: #fff;
    pointer-events: none;
  }
  .layer-drawer.open { transform: translateX(0); pointer-events: auto; }
  .layer-header { padding: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
  .layer-drawer-close { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
  
  .layer-toolbar-top { padding: 10px 16px; display: flex; gap: 8px; background: rgba(255,255,255,0.02); border-bottom: 0.5px solid rgba(255,255,255,0.05); }
  .layer-top-btn { flex: 1; background: #27272a; border: none; color: #eee; padding: 8px; border-radius: 12px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .layer-top-btn:active { background: #3f3f46; }

  .layer-list { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .layer-item { background: rgba(39,39,42,0.6); border-radius: 16px; padding: 10px; border: 1.5px solid transparent; }
  .layer-item.selected { border-color: #00ff66; background: rgba(0,255,102,0.08); }
  .layer-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .layer-name { font-size: 13px; font-weight: 500; cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-actions { display: flex; gap: 6px; align-items: center; }
  .layer-act-btn { background: rgba(255,255,255,0.05); border: none; color: #d4d4d8; font-size: 13px; padding: 5px 8px; border-radius: 8px; cursor: pointer; }
  .layer-act-btn:active { background: rgba(255,255,255,0.15); }
  .layer-act-btn.active { color: #ff453a; background: rgba(255,69,58,0.1); font-weight: bold; }
  .opacity-slider { width: 100%; height: 4px; accent-color: #00ff66; margin-top: 8px; display: block; }

  /* TOAST & UTILS */
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 8px 20px; border-radius: 40px; font-size: 13px; color: #00ff66; z-index: 2500; opacity: 0; transition: opacity 0.2s; pointer-events: none; border: 0.5px solid rgba(0,255,102,0.3); }
  .hidden { display: none !important; }
  
  .ui-hidden .top-bar, .ui-hidden .bottom-toolbar, .ui-hidden .floating-panel, .ui-hidden .sub-context-menu, .ui-hidden .text-hud { opacity: 0; pointer-events: none; }
</style>

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PENDraw">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

</head>
<body>

<div id="viewportContainer">
  <div id="canvasStage">
    <canvas id="bgImageCanvas" width="1600" height="2200" style="position:absolute; top:0; left:0; z-index:0; pointer-events:none;"></canvas>
    <div id="paintLayersContainer"></div>
    <div id="fabricLayerWrapper"><canvas id="fabricLayer" width="1600" height="2200"></canvas></div>
  </div>
</div>

<div class="top-bar">
  <div class="top-bar-section upper-section">
    <button class="top-btn" id="btnNew">📄 新規</button>
    <button class="top-btn" id="btnAdd">➕ 追加</button>
    <button class="top-btn" id="btnEdit">✏️ 編集</button> 
    <button class="top-btn" id="btnView">👁️ 表示</button>
    <button class="top-btn" id="btnFileMenu">📁 ファイル</button>
    <button class="top-btn" id="btnExport">📤 出力</button>
    <input type="file" id="projectFileInput" accept=".pendproj,application/json" hidden>
  </div>
  <div class="project-status" id="projectStatus">未保存の新規プロジェクト</div>
  <div class="top-bar-section bottom-section">
    <button class="top-btn layer-toggle-btn" id="btnLayerShortcut">🎨 レイヤー</button>
    <button class="top-btn" id="btnUndoShortcut">↩️ Undo</button>
    <button class="top-btn" id="btnRedoShortcut">↪️ Redo</button>
    <button class="top-btn text-hud.danger" id="btnClearShortcut" style="color:#ff453a;">🧹 全消去</button>
  </div>
</div>

<div class="bottom-toolbar" id="bottomToolbarFloating">
  <div class="toolbar-handle" id="toolbarHandle">⋮⋮</div>
  <button class="tool-icon" data-tool="select" title="オブジェクト選択">🔍</button>
  <button class="tool-icon" data-tool="draw" title="手書きペン">✏️</button>
  <button class="tool-icon" data-tool="fillbucket" title="バケツ塗りつぶし">🪣</button>
  <button class="tool-icon" data-tool="eyedropper" title="カラー自動スポイト">💧</button>
  <button class="tool-icon" data-tool="shape_union" title="直線・図形メニュー">📐</button>
</div>

<div id="brushSizeMenu" class="sub-context-menu hidden">
  <div class="sub-context-item" data-size="4">● 細 (4px)</div>
  <div class="sub-context-item data-active" data-size="12">● 中 (12px)</div>
  <div class="sub-context-item" data-size="32">● 太 (32px)</div>
</div>

<div class="floating-panel" id="movablePalette">
  <div class="panel-handle" id="paletteHandle">⋮⋮</div>
  <div class="palette-scroll" id="paletteScroll"></div>
  <input type="color" id="nativeColorPicker" class="native-picker" value="#00ff66">
</div>

<div class="floating-panel" id="movableDpad">
  <div class="panel-handle" id="dpadHandle">••••••</div>
  <div class="dpad-grid">
    <div class="dpad-btn" data-dir="up-left">◤</div>
    <div class="dpad-btn" data-dir="up">▲</div>
    <div class="dpad-btn" data-dir="up-right">◥</div>
    <div class="dpad-btn" data-dir="left">◀</div>
    <div class="dpad-btn center-btn" data-dir="center">🟢</div>
    <div class="dpad-btn" data-dir="right">▶</div>
    <div class="dpad-btn" data-dir="down-left">◣</div>
    <div class="dpad-btn" data-dir="down">▼</div>
    <div class="dpad-btn" data-dir="down-right">◢</div>
  </div>
</div>

<div id="newCanvasModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-title">新規キャンバス設定</div>
    <div class="modal-row">
      <button type="button" class="modal-btn" data-preset="A4V">A4 縦 (1600x2200)</button>

<script>
  if (typeof window.fabric === 'undefined') {
    document.body.innerHTML = '<div style="padding:24px;color:#fff;background:#18181b;font:16px/1.7 sans-serif;min-height:100vh">' +
      '<h2>PENDrawを起動できません</h2><p>編集エンジン（Fabric.js）を読み込めませんでした。</p>' +
      '<p>インターネット接続を確認して、ページを再読み込みしてください。</p></div>';
    throw new Error('Fabric.js dependency is unavailable');
  }
  // ======================== GLOBAL VARIABLES & SYSTEM CONFIG ========================
  let CANVAS_W = 1600, CANVAS_H = 2200;
  const fabricCanvasEl = document.getElementById('fabricLayer');
  const fabricWrapper = document.getElementById('fabricLayerWrapper');
  const stage = document.getElementById('canvasStage');
  const container = document.getElementById('viewportContainer');
  const paintContainer = document.getElementById('paintLayersContainer');
  const bgCanvas = document.getElementById('bgImageCanvas');
  const bgCtx = bgCanvas.getContext('2d');

  let fabricCanvas = null;
  // ツール切替で一時的に選択が外れても、文字色の適用先を保持する
  let lastColorTextTarget = null;
  let paintLayers = [];
  let activePaintLayerIndex = 0;
  let bgImageElement = null;
  let bgImageDataUrl = null;
  let bgVisible = true;

  // VIEWPORT MATRIX
  let viewportZoom = 1.0, viewportX = 0, viewportY = 0;
  let initialDistance = 0, initialZoom = 1;
  let isPanning = false, panStart = { x: 0, y: 0 };
  
  // TOOLS & BRUSH
  let currentTool = "select";
  let brushColor = "#00ff66", brushSize = 12;
  let isDrawing = false, lastPoint = { x: 0, y: 0 };

  // 直線ツール(line)用状態管理変数
  let lineStartPoint = null;

  // INTEGRATED GLOBAL HISTORY (FOR PERFECT UNDO/REDO)
  let globalHistory = [];
  let globalHistoryIndex = -1;
  let isApplyingHistory = false;

  // PROJECT SAVE / RECOVERY
  const PROJECT_FORMAT = 'PENDRAW_PROJECT';
  const PROJECT_VERSION = 1;
  let projectId = generateUUID();
  let projectName = '名称未設定';
  let projectFileHandle = null;
  let lastProjectFileSnapshot = null;
  let autosaveTimer = null;
  let isProjectDirty = false;
  let isRestoringProject = false;

  let isEditingText = false;
  let currentEditingTargetObject = null;
  let modalSelectedFont = "sans-serif";
  let modalSelectedSize = 48;

  let activeSubmenu = null;
  let activeSubmenuTriggerId = null; // ⑥ 多重・トグル判定用の一意な識別タグ
  let dpadInterval = null;
  let longPressTimer = null;
  
  const toast = document.getElementById('statusToast');
  const nativePicker = document.getElementById('nativeColorPicker');
  const brushSizeMenu = document.getElementById('brushSizeMenu');

  function showStatus(msg) { toast.innerText = msg; toast.style.opacity = '1'; if(window.toastTimer) clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toast.style.opacity = '0', 1600); }
  function generateUUID() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); }

  fabric.Object.prototype.cornerColor = '#00ff66';
  fabric.Object.prototype.cornerStrokeColor = '#09090b';
  fabric.Object.prototype.borderColor = '#00ff66';
  fabric.Object.prototype.borderScaleFactor = 4;
  fabric.Object.prototype.cornerStyle = 'circle';
  fabric.Object.prototype.cornerSize = 24;
  fabric.Object.prototype.transparentCorners = false;
  
  // 画面表示倍率に応じて、選択ハンドルを実画面上で押しやすい大きさに保つ
  function getScreenFriendlyCornerSize() {
    const z = Math.max(0.08, viewportZoom || 1);
    // 旧デフォルトより一回り大きい程度。画面上では約18pxに保つ
    return Math.max(12, Math.min(220, 18 / z));
  }

  function isTextObject(obj) {
    return !!obj && (obj.type === 'text' || obj.type === 'i-text' || obj.type === 'textbox');
  }

  // 旧バージョンで保存された fabric.Text は直接編集できないため、
  // 読み込み時に同じ属性を引き継いだ fabric.IText に置き換える。
  function upgradeTextObjectsForEditing() {
    if (!fabricCanvas) return;
    const objects = fabricCanvas.getObjects().slice();
    objects.forEach((obj) => {
      if (obj && obj.type === 'text' && fabric.IText) {
        const index = fabricCanvas.getObjects().indexOf(obj);
        const options = obj.toObject(['uuid', 'locked', 'name', 'shadow']);
        const editable = new fabric.IText(obj.text || '', options);
        editable.uuid = obj.uuid || generateUUID();
        fabricCanvas.remove(obj);
        fabricCanvas.insertAt(editable, index, false);
        applySelectableProps(editable);
      } else if (isTextObject(obj)) {
        applySelectableProps(obj);
      }
    });
    fabricCanvas.requestRenderAll();
  }

  function beginCanvasTextEditing(obj) {
    if (!isTextObject(obj) || typeof obj.enterEditing !== 'function') return;
    if (currentTool !== 'select' && currentTool !== 'text') setTool('select');
    fabricCanvas.setActiveObject(obj);
    if (typeof obj.enterEditing === 'function') obj.enterEditing();
    if (obj.hiddenTextarea) {
      obj.hiddenTextarea.focus();
      obj.hiddenTextarea.setSelectionRange(obj.text.length, obj.text.length);
    }
    document.getElementById('textObjectHud').classList.add('hidden');
    fabricCanvas.requestRenderAll();
  }

  function applySelectableProps(obj) {
    const handleSize = getScreenFriendlyCornerSize();
    obj.set({
      selectable: true,
      evented: true,
      hasControls: true,
      hasBorders: true,
      padding: 16,
      cornerSize: handleSize,
      touchCornerSize: handleSize,
      lockUniScaling: false
    });
    if(!obj.uuid) obj.uuid = generateUUID();
    return obj;
  }

  function getCanvasCenterCoordinates() {
    const rect = container.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(CANVAS_W, ((rect.width / 2) - viewportX) / viewportZoom)),
      y: Math.max(0, Math.min(CANVAS_H, ((rect.height / 2) - viewportY) / viewportZoom))
    };
  }

  function fitToScreen() {
    const containerW = container.clientWidth || window.innerWidth;
    const containerH = container.clientHeight || window.innerHeight;
    const margin = 24;
    const scaleX = (containerW - margin * 2) / CANVAS_W;
    const scaleY = (containerH - margin * 2) / CANVAS_H;
    viewportZoom = Math.min(scaleX, scaleY, 1.0);
    viewportX = (containerW - CANVAS_W * viewportZoom) / 2;
    viewportY = (containerH - CANVAS_H * viewportZoom) / 2;
    applyViewportTransform();
  }

  // ======================== PROJECT SAVE / LOAD / AUTOSAVE ========================
  function updateProjectStatus() {
    const el = document.getElementById('projectStatus');
    if (!el) return;
    el.textContent = `${projectName}${isProjectDirty ? ' ・未保存の変更あり' : ' ・保存済み'}`;
    el.classList.toggle('dirty', isProjectDirty);
  }

  function setProjectDirty(snapshot) {
    if (isRestoringProject) return;
    isProjectDirty = snapshot !== lastProjectFileSnapshot;
    updateProjectStatus();
    scheduleProjectAutosave(snapshot);
  }

  function openRecoveryDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB非対応'));
      const req = indexedDB.open('PENDrawRecoveryDB', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'projectId' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDBを開けません'));
    });
  }

  async function writeRecoveryRecord(snapshot) {
    const db = await openRecoveryDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('projects', 'readwrite');
      tx.objectStore('projects').put({
        projectId, projectName, snapshot,
        updatedAt: new Date().toISOString(),
        projectFileSnapshot: lastProjectFileSnapshot
      });
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error || new Error('自動保存に失敗しました')); };
      tx.onabort = () => { db.close(); reject(tx.error || new Error('自動保存が中断されました')); };
    });
  }

  async function readRecoveryRecord() {
    const db = await openRecoveryDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('projects', 'readonly');
      const req = tx.objectStore('projects').get(projectId);
      req.onsuccess = () => { const value = req.result || null; db.close(); resolve(value); };
      req.onerror = () => { db.close(); reject(req.error); };
    });
  }

  async function readLatestRecoveryRecord() {
    const db = await openRecoveryDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('projects', 'readonly');
      const req = tx.objectStore('projects').getAll();
      req.onsuccess = () => {
        const items = req.result || [];
        db.close();
        items.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        resolve(items[0] || null);
      };
      req.onerror = () => { db.close(); reject(req.error); };
    });
  }

  function scheduleProjectAutosave(snapshot) {
    if (isRestoringProject) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(async () => {
      try {
        await writeRecoveryRecord(snapshot);
        showStatus('自動バックアップ済み');
      } catch (err) {
        console.warn('PENDraw autosave failed:', err);
        showStatus('自動バックアップに失敗しました');
      }
    }, 900);
  }

  function getCurrentProjectState() {
    if (globalHistoryIndex >= 0 && globalHistory[globalHistoryIndex]) {
      return JSON.parse(globalHistory[globalHistoryIndex]);
    }
    return {
      canvasWidth: CANVAS_W, canvasHeight: CANVAS_H, activeIdx: activePaintLayerIndex,
      layers: [], fabricJSON: fabricCanvas ? JSON.stringify(fabricCanvas.toJSON(['uuid','locked','name','shadow'])) : null,
      bgVisible, bgImageDataUrl
    };
  }

  function downloadProjectBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  async function saveProjectFile(forceSaveAs = false) {
    const snapshot = globalHistory[globalHistoryIndex] || JSON.stringify(getCurrentProjectState());
    const project = {
      format: PROJECT_FORMAT,
      version: PROJECT_VERSION,
      projectId,
      name: projectName,
      savedAt: new Date().toISOString(),
      state: JSON.parse(snapshot)
    };
    const blob = new Blob([JSON.stringify(project)], { type: 'application/vnd.pendraw.project+json' });
    const safeName = (projectName || '名称未設定').replace(/[\\/:*?"<>|]/g, '_');
    const filename = safeName.endsWith('.pendproj') ? safeName : safeName + '.pendproj';

    try {
      if ('showSaveFilePicker' in window) {
        if (!projectFileHandle || forceSaveAs) {
          projectFileHandle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'PENDrawプロジェクト', accept: { 'application/vnd.pendraw.project+json': ['.pendproj'] } }]
          });
        }
        const writable = await projectFileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
      } else {
        downloadProjectBlob(blob, filename);
      }
      lastProjectFileSnapshot = snapshot;
      isProjectDirty = false;
      updateProjectStatus();
      try { await writeRecoveryRecord(snapshot); } catch (e) { console.warn(e); }
      showStatus('プロジェクトを保存しました');
      return true;
    } catch (err) {
      if (err && err.name === 'AbortError') {
        showStatus('保存をキャンセルしました');
        return false;
      }
      console.error(err);
      showStatus('保存に失敗しました');
      alert('プロジェクトを保存できませんでした。保存先の空き容量やアクセス権を確認してください。');
      return false;
    }
  }

  function restoreProjectState(state) {
    if (!state || !Array.isArray(state.layers) || !state.canvasWidth || !state.canvasHeight) {
      throw new Error('プロジェクトデータの構造が正しくありません');
    }
    isRestoringProject = true;
    globalHistory = [JSON.stringify(state)];
    globalHistoryIndex = 0;
    applySystemStateFromHistory();
    setTimeout(() => {
      isRestoringProject = false;
      const snapshot = globalHistory[globalHistoryIndex];
      lastProjectFileSnapshot = snapshot;
      isProjectDirty = false;
      updateProjectStatus();
      fitToScreen();
    }, 250);
  }

  async function openProjectFile(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const project = JSON.parse(text);
      if (project.format !== PROJECT_FORMAT || !project.state) throw new Error('PENDrawプロジェクトではありません');
      if (project.version > PROJECT_VERSION) throw new Error('このプロジェクトは新しいバージョンのPENDrawで作成されています');
      if (isProjectDirty && !confirm('現在のプロジェクトに未保存の変更があります。開くと現在の作業内容が置き換わります。続行しますか？')) return;
      projectId = project.projectId || generateUUID();
      projectName = project.name || file.name.replace(/\\.pendproj$/i, '');
      projectFileHandle = null;
      restoreProjectState(project.state);
      showStatus('プロジェクトを開きました');
    } catch (err) {
      console.error(err);
      alert('プロジェクトを開けませんでした。ファイル形式またはデータが破損している可能性があります。\\n' + err.message);
    }
  }

  async function offerRecoveryOnStartup() {
    try {
      const record = await readLatestRecoveryRecord();
      if (!record || !record.snapshot) return;
      const age = Date.now() - new Date(record.updatedAt).getTime();
      if (!Number.isFinite(age) || age > 30 * 24 * 60 * 60 * 1000) return;
      if (confirm(`前回の作業バックアップがあります。\\n\\nプロジェクト：${record.projectName || '名称未設定'}\\n最終バックアップ：${new Date(record.updatedAt).toLocaleString()}\\n\\n復元しますか？`)) {
        const state = JSON.parse(record.snapshot);
        projectId = record.projectId || generateUUID();
        projectName = record.projectName || '復元プロジェクト';
        projectFileHandle = null;
        restoreProjectState(state);
        lastProjectFileSnapshot = record.projectFileSnapshot || null;
        isProjectDirty = record.snapshot !== lastProjectFileSnapshot;
        updateProjectStatus();
        showStatus('前回の作業を復元しました');
      }
    } catch (err) {
      console.warn('Recovery check failed:', err);
    }
  }

  // Browser-native warning for closing/reloading a tab with unsaved project-file changes.
  window.addEventListener('beforeunload', (event) => {
    if (!isProjectDirty) return;
    event.preventDefault();
    event.returnValue = '';
  });

  // ======================== INTEGRATED GLOBAL HISTORY ENGINE ========================
  function commitSystemState() {
    if (isApplyingHistory) return;
    if (isEditingText) return;
    
    const layersData = paintLayers.map(l => {
      return { id: l.id, name: l.name, visible: l.visible, locked: l.locked, opacity: l.opacity, dataUrl: l.canvas.toDataURL() };
    });
    const state = {
      canvasWidth: CANVAS_W,
      canvasHeight: CANVAS_H,
      activeIdx: activePaintLayerIndex,
      layers: layersData,
      fabricJSON: fabricCanvas ? JSON.stringify(fabricCanvas.toJSON(['uuid','locked','name','shadow'])) : null,
      bgVisible: bgVisible,
      bgImageDataUrl: bgImageDataUrl
    };
    const snapshot = JSON.stringify(state);
    if (globalHistory[globalHistoryIndex] === snapshot) return;
    globalHistory = globalHistory.slice(0, globalHistoryIndex + 1);
    globalHistory.push(snapshot);
    if (globalHistory.length > 20) globalHistory.shift();
    globalHistoryIndex = globalHistory.length - 1;
    setProjectDirty(snapshot);
  }

  function performUndo() {
    if (globalHistoryIndex > 0) {
      globalHistoryIndex--;
      applySystemStateFromHistory();
      setProjectDirty(globalHistory[globalHistoryIndex]);
      showStatus('元に戻す (Undo)');
    } else {
      showStatus('これ以上戻せません');
    }
  }

  function performRedo() {
    if (globalHistoryIndex < globalHistory.length - 1) {
      globalHistoryIndex++;
      applySystemStateFromHistory();
      setProjectDirty(globalHistory[globalHistoryIndex]);
      showStatus('やり直し (Redo)');
    } else {
      showStatus('最新の状態です');
    }
  }

  function applySystemStateFromHistory() {
    if (!globalHistory[globalHistoryIndex]) return;
    isApplyingHistory = true;
    const state = JSON.parse(globalHistory[globalHistoryIndex]);

    CANVAS_W = Math.max(1, Number(state.canvasWidth) || CANVAS_W);
    CANVAS_H = Math.max(1, Number(state.canvasHeight) || CANVAS_H);
    stage.style.width = CANVAS_W + 'px';
    stage.style.height = CANVAS_H + 'px';
    bgCanvas.width = CANVAS_W;
    bgCanvas.height = CANVAS_H;
    fabricCanvasEl.width = CANVAS_W;
    fabricCanvasEl.height = CANVAS_H;
    if (fabricCanvas) {
      fabricCanvas.setWidth(CANVAS_W);
      fabricCanvas.setHeight(CANVAS_H);
    }

    bgVisible = state.bgVisible !== false;
    bgImageDataUrl = state.bgImageDataUrl || null;
    bgImageElement = null;
    if (bgImageDataUrl) {
      const restoredBg = new Image();
      restoredBg.onload = () => { bgImageElement = restoredBg; renderBackground(); };
      restoredBg.onerror = () => { bgImageElement = null; renderBackground(); showStatus('背景画像の復元に失敗しました'); };
      restoredBg.src = bgImageDataUrl;
    } else {
      renderBackground();
    }

    paintLayers.forEach(l => {
      if(l.canvas && l.canvas.parentNode) l.canvas.parentNode.removeChild(l.canvas);
    });
    paintLayers = [];
    
    if(state.layers.length === 0) {
      isApplyingHistory = false;
      return;
    }
    
    let loadedCount = 0;
    state.layers.forEach((lData, index) => {
      const canvasEl = document.createElement('canvas');
      canvasEl.width = CANVAS_W;
      canvasEl.height = CANVAS_H;
      canvasEl.className = 'layer-canvas';
      canvasEl.style.zIndex = index + 1;
      paintContainer.appendChild(canvasEl);
      
      const ctx = canvasEl.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0);
        loadedCount++;
        if (loadedCount === state.layers.length) {
          activePaintLayerIndex = state.activeIdx;
          renderAllPaintLayers();
          if (fabricCanvas && state.fabricJSON) {
            fabricCanvas.loadFromJSON(JSON.parse(state.fabricJSON), () => {
              upgradeTextObjectsForEditing();
              fabricCanvas.getObjects().forEach(obj => {
                applySelectableProps(obj);
              });
              fabricCanvas.renderAll();
              isApplyingHistory = false;
              refreshLayerPanel();
            });
          } else {
            isApplyingHistory = false;
            refreshLayerPanel();
          }
        }
      };
      img.src = lData.dataUrl;
      
      paintLayers.push({
        id: lData.id,
        name: lData.name,
        canvas: canvasEl,
        ctx: ctx,
        visible: lData.visible,
        locked: lData.locked,
        opacity: lData.opacity
      });
    });
  }

  function createPaintLayer(name = "新規レイヤー", skipCommit = false) {
    const id = generateUUID();
    const canvasEl = document.createElement('canvas');
    canvasEl.width = CANVAS_W;
    canvasEl.height = CANVAS_H;
    canvasEl.className = 'layer-canvas';
    paintContainer.appendChild(canvasEl);
    
    const ctx = canvasEl.getContext('2d');
    const newLayer = { id, name, canvas: canvasEl, ctx, visible: true, locked: false, opacity: 1.0 };
    
    paintLayers.splice(activePaintLayerIndex + 1, 0, newLayer);
    activePaintLayerIndex = paintLayers.indexOf(newLayer);
    
    renderAllPaintLayers();
    refreshLayerPanel();
    if (!skipCommit) commitSystemState();
    return newLayer;
  }

  function renderAllPaintLayers() {
    paintLayers.forEach((layer, i) => {
      layer.canvas.style.zIndex = i + 1;
      layer.canvas.style.opacity = layer.opacity;
      layer.canvas.style.display = layer.visible ? 'block' : 'none';
    });
    if(fabricWrapper) fabricWrapper.style.zIndex = paintLayers.length + 10;
  }

  function getActivePaintCtx() {
    return paintLayers[activePaintLayerIndex]?.visible && !paintLayers[activePaintLayerIndex]?.locked ? paintLayers[activePaintLayerIndex].ctx : null;
  }

  function drawOnActiveLayer(x,y,isStart){
    const ctx = getActivePaintCtx();
    if(!ctx) return;
    ctx.save();
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.lineWidth=brushSize;
    if (currentTool === 'eraser') {
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.globalCompositeOperation = 'destination-out';
    } else {
      ctx.strokeStyle = brushColor;
      ctx.globalCompositeOperation = 'source-over';
    }
    if(isStart){
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x,y);
      ctx.stroke();
    } else{
      ctx.beginPath();
      ctx.moveTo(lastPoint.x,lastPoint.y);
      ctx.lineTo(x,y);
      ctx.stroke();
    }
    ctx.restore();
    lastPoint = {x,y};
  }

  function floodFillActiveLayer(startX, startY, fillHex) {
    const layer = paintLayers[activePaintLayerIndex];
    if (!layer || !layer.visible || layer.locked) return;
    const ctx = layer.ctx;
    startX = Math.floor(startX);
    startY = Math.floor(startY);
    if (startX < 0 || startX >= CANVAS_W || startY < 0 || startY >= CANVAS_H) return;

    const imgData = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H);
    const data = imgData.data;
    const r = parseInt(fillHex.slice(1, 3), 16);
    const g = parseInt(fillHex.slice(3, 5), 16);
    const b = parseInt(fillHex.slice(5, 7), 16);
    const targetIdx = (startY * CANVAS_W + startX) * 4;
    const tr = data[targetIdx], tg = data[targetIdx + 1];
    const tb = data[targetIdx + 2], ta = data[targetIdx + 3];
    if (tr === r && tg === g && tb === b && ta === 255) return;

    // Each pixel is recolored when enqueued, so it can enter the queue only once.
    const queue = new Int32Array(CANVAS_W * CANVAS_H);
    let head = 0, tail = 0;
    const matches = (n) => {
      const p = n * 4;
      return data[p] === tr && data[p + 1] === tg && data[p + 2] === tb && data[p + 3] === ta;
    };
    const enqueue = (n) => {
      if (tail >= queue.length || !matches(n)) return;
      const p = n * 4;
      data[p] = r; data[p + 1] = g; data[p + 2] = b; data[p + 3] = 255;
      queue[tail++] = n;
    };
    enqueue(startY * CANVAS_W + startX);
    while (head < tail) {
      const n = queue[head++];
      const x = n % CANVAS_W, y = Math.floor(n / CANVAS_W);
      if (x > 0) enqueue(n - 1);
      if (x < CANVAS_W - 1) enqueue(n + 1);
      if (y > 0) enqueue(n - CANVAS_W);
      if (y < CANVAS_H - 1) enqueue(n + CANVAS_W);
    }
    ctx.putImageData(imgData, 0, 0);
    commitSystemState();
  }

  // ① スポイトツール修正：勝手なツール切り替え「setTool('select');」を完全に排除
  // スポイト：画面の重なり順（Fabric → ペイント → 背景）で最前面の色を取得
  function executeEyedropper(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || x >= CANVAS_W || y < 0 || y >= CANVAS_H) return;

    // Fabricオブジェクトはペイントレイヤーより前面に表示される
    if (fabricCanvas) {
      try {
        const fabObjects = fabricCanvas.getObjects();
        for (let i = fabObjects.length - 1; i >= 0; i--) {
          const obj = fabObjects[i];
          if (!obj.visible || !obj.containsPoint(new fabric.Point(x, y))) continue;
          const col = obj.fill || obj.stroke;
          if (col && typeof col === 'string' && /^#[0-9a-f]{6}$/i.test(col)) {
            updateSystemColor(col);
            showStatus(`色を取得 (オブジェクト層): ${col}`);
            return;
          }
        }
      } catch (e) {}
    }

    // ペイントレイヤーは上から下へ確認。透明度0のレイヤーは対象外
    for (let i = paintLayers.length - 1; i >= 0; i--) {
      const layer = paintLayers[i];
      if (!layer.visible || layer.opacity <= 0) continue;
      try {
        const pixel = layer.ctx.getImageData(x, y, 1, 1).data;
        if (pixel[3] * layer.opacity > 5) {
          const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
          updateSystemColor(hex);
          showStatus(`色を取得 (レイヤー層): ${hex}`);
          return;
        }
      } catch (e) {}
    }

    // 背景は最背面
    try {
      const pixel = bgCtx.getImageData(x, y, 1, 1).data;
      if (pixel[3] >= 10) {
        const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
        updateSystemColor(hex);
        showStatus(`色を取得 (背景層): ${hex}`);
        return;
      }
    } catch (e) {}
    showStatus("透明なピクセルです");
  }

  function updateSystemColor(hex) {
    if (!hex || !/^#[0-9a-f]{6}$/i.test(hex)) return;
    brushColor = hex;
    if (nativePicker) nativePicker.value = hex;

    // 現在の選択を優先。スポイトに切り替えた際に選択が外れた場合は
    // 直前に選択していた文字オブジェクトへ適用する。
    const active = fabricCanvas && fabricCanvas.getActiveObject
      ? fabricCanvas.getActiveObject() : null;
    const target = (active && isTextObject(active))
      ? active
      : (lastColorTextTarget && fabricCanvas &&
         fabricCanvas.getObjects().includes(lastColorTextTarget)
          ? lastColorTextTarget : null);

    if (target) {
      target.set('fill', hex);
      if (typeof target.setCoords === 'function') target.setCoords();
      fabricCanvas.requestRenderAll();
      if (!isApplyingHistory) commitSystemState();
      showStatus(`文字色を変更: ${hex}`);
    }
  }

  function renderBackground() {
    bgCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    if (!bgVisible) return;
    if (bgImageElement) {
      let scale = Math.max(CANVAS_W / bgImageElement.width, CANVAS_H / bgImageElement.height);
      let w = bgImageElement.width * scale;
      let h = bgImageElement.height * scale;
      bgCtx.drawImage(bgImageElement, (CANVAS_W - w)/2, (CANVAS_H - h)/2, w, h);
    } else {
      bgCtx.fillStyle = '#ffffff';
      bgCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
  }

  function compositeAllPaintLayers(ctx) {
    paintLayers.forEach(layer=>{
      if(layer.visible){
        ctx.globalAlpha=layer.opacity;
        ctx.drawImage(layer.canvas,0,0);
      }
    });
    ctx.globalAlpha=1;
  }

  // ======================== FABRIC.JS ENGINE ========================
  function initFabric() {
    fabricCanvas = new fabric.Canvas('fabricLayer', {
      containerClass: 'fabric-container-override',
      enableRetinaScaling: false,
      fireRightClick: true,
      selection: true,
      uniformScaling: true
    });
    // 四隅のドラッグは縦横比を維持した拡大・縮小に統一する
    fabricCanvas.uniformScaling = true;
    if (fabric.controlsUtils && typeof fabric.controlsUtils.scalingEqually === 'function') {
      ['tl', 'tr', 'br', 'bl'].forEach(key => {
        if (fabric.Object.prototype.controls && fabric.Object.prototype.controls[key]) {
          fabric.Object.prototype.controls[key].actionHandler = fabric.controlsUtils.scalingEqually;
        }
      });
    }

    fabricCanvas.on('object:modified', () => { commitSystemState(); });
    fabricCanvas.on('object:added', () => { if (!isApplyingHistory) commitSystemState(); });
    fabricCanvas.on('object:removed', () => { if (!isApplyingHistory) commitSystemState(); });

    // IText の編集終了を履歴・自動保存へ反映する
    fabricCanvas.on('text:editing:exited', () => {
      if (!isApplyingHistory) commitSystemState();
      const active = fabricCanvas.getActiveObject();
      if (active && isTextObject(active)) handleObjectSelection({ selected: [active] });
    });

    // テキストをキャンバス上でダブルクリックすると、その場で直接編集できる
    fabricCanvas.on('mouse:dblclick', (options) => {
      const target = options && options.target;
      if (isTextObject(target)) {
        beginCanvasTextEditing(target);
      }
    });

    fabricCanvas.on('selection:created', (e) => {
      const selected = (e && e.selected) || [];
      const textTarget = selected.find(obj => isTextObject(obj));
      if (textTarget) lastColorTextTarget = textTarget;
      handleObjectSelection(e);
    });
    fabricCanvas.on('selection:updated', (e) => {
      const selected = (e && e.selected) || [];
      const textTarget = selected.find(obj => isTextObject(obj));
      if (textTarget) lastColorTextTarget = textTarget;
      handleObjectSelection(e);
    });
    fabricCanvas.on('selection:cleared', () => {
      document.getElementById('textObjectHud').classList.add('hidden');
    });

    // ⑧ 線ツールの描画開始・追従イベント処理
    fabricCanvas.on('mouse:down', (options) => {
      if (currentTool !== 'line') return;
      const pointer = fabricCanvas.getPointer(options.e);
      lineStartPoint = { x: pointer.x, y: pointer.y };
      
      // ⑧ strokeにbrushColorおよび現在の太さを完全反映
      const line = new fabric.Line([lineStartPoint.x, lineStartPoint.y, lineStartPoint.x, lineStartPoint.y], {
        stroke: brushColor,
        strokeWidth: brushSize,
        selectable: false,
        evented: false,
        originX: 'center',
        originY: 'center'
      });
      fabricCanvas.add(line);
      fabricCanvas.setActiveObject(line);
    });

    fabricCanvas.on('mouse:move', (options) => {
      if (currentTool !== 'line' || !lineStartPoint) return;
      const pointer = fabricCanvas.getPointer(options.e);
      const activeObj = fabricCanvas.getActiveObject();
      if (activeObj && activeObj.type === 'line') {
        activeObj.set({ x2: pointer.x, y2: pointer.y });
        fabricCanvas.renderAll();
      }
    });

    fabricCanvas.on('mouse:up', () => {
      if (currentTool !== 'line' || !lineStartPoint) return;
      const activeObj = fabricCanvas.getActiveObject();
      if (activeObj && activeObj.type === 'line') {
        applySelectableProps(activeObj);
        activeObj.setCoords();
      }
      lineStartPoint = null;
      commitSystemState();
      setTool('select');
    });
  }

  function handleObjectSelection(e) {
    if(document.body.classList.contains('ui-hidden')) return;
    const obj = e.selected[0];
    if(!obj) return;
    const hud = document.getElementById('textObjectHud');
    hud.classList.remove('hidden');
    
    // テキストオブジェクトのみ編集関連ボタンを表示する簡易制御
    const isText = isTextObject(obj);
    const currentScale = Math.max(Math.abs(obj.scaleX || 1), Math.abs(obj.scaleY || 1));
    document.getElementById('hudScaleInput').value = String(Math.round(currentScale * 100));
    document.getElementById('hudBtnEdit').style.display = isText ? 'inline-block' : 'none';
    document.getElementById('hudBtnSizePlus').style.display = isText ? 'inline-block' : 'none';
    document.getElementById('hudBtnSizeMinus').style.display = isText ? 'inline-block' : 'none';
    document.getElementById('hudBtnBold').style.display = isText ? 'inline-block' : 'none';
    document.getElementById('hudBtnStroke').style.display = isText ? 'inline-block' : 'none';
  }

  function setTool(toolName) {
    currentTool = toolName;
    lineStartPoint = null;
    document.querySelectorAll('.tool-icon').forEach(btn => {
      if(toolName === 'line' || toolName === 'shape_rect' || toolName === 'shape_circle' || toolName === 'select_rect' || toolName === 'select_circle') {
        if(btn.dataset.tool === 'shape_union' || btn.dataset.tool === 'select') btn.classList.add('active');
        else btn.classList.remove('active');
      } else {
        if(btn.dataset.tool === toolName) btn.classList.add('active');
        else btn.classList.remove('active');
      }
    });
    setLayerInteractions(toolName);
    brushSizeMenu.classList.add('hidden');
    showStatus(`ツール変更: ${toolName}`);
  }

  function setLayerInteractions(tool) {
    if(!fabricCanvas) return;
    if(tool === 'select' || tool === 'text') {
      fabricWrapper.style.pointerEvents = 'auto';
      fabricCanvas.selection = true;
      fabricCanvas.getObjects().forEach(obj => { obj.selectable = true; obj.evented = true; });
    } else if(tool === 'line') {
      fabricWrapper.style.pointerEvents = 'auto';
      fabricCanvas.selection = false;
      fabricCanvas.getObjects().forEach(obj => { obj.selectable = false; obj.evented = false; });
      fabricCanvas.discardActiveObject().renderAll();
    } else {
      fabricWrapper.style.pointerEvents = 'none';
      fabricCanvas.selection = false;
      fabricCanvas.getObjects().forEach(obj => { obj.selectable = false; obj.evented = false; });
      fabricCanvas.discardActiveObject().renderAll();
    }
  }

  // ======================== POINTER INTERACTION MUX ========================
  function getStagePointerCoordinates(e) {
    const rect = stage.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) / viewportZoom, y: (clientY - rect.top) / viewportZoom };
  }

  function handleStagePointerDown(e) {
    if(document.body.classList.contains('ui-hidden')) return;
    if(e.target.id === 'toolbarHandle' || e.target.tagName === 'BUTTON' || e.target.closest('.floating-panel') || e.target.closest('.top-bar') || e.target.closest('.bottom-toolbar') || e.target.closest('.submenu') || e.target.closest('.modal-card') || e.target.closest('.text-hud') || e.target.closest('.layer-drawer')) return;
    if(e.touches && e.touches.length >= 2) return;
    
    const coords = getStagePointerCoordinates(e);
    isDrawing = true;
    lastPoint = { x: coords.x, y: coords.y };
    
    if (currentTool === 'draw' || currentTool === 'eraser') {
      drawOnActiveLayer(coords.x, coords.y, true);
    } else if (currentTool === 'fillbucket') {
      floodFillActiveLayer(coords.x, coords.y, brushColor);
      isDrawing = false;
    } else if (currentTool === 'eyedropper') {
      executeEyedropper(coords.x, coords.y);
      isDrawing = false;
    }
  }

  function handleStagePointerMove(e) {
    if (!isDrawing) return;
    const coords = getStagePointerCoordinates(e);
    if (currentTool === 'draw' || currentTool === 'eraser') {
      drawOnActiveLayer(coords.x, coords.y, false);
    }
  }

  function handleStagePointerUp() {
    if(isDrawing && (currentTool === 'draw' || currentTool === 'eraser')) {
      commitSystemState();
    }
    isDrawing = false;
  }

  function applyViewportTransform() {
    stage.style.transform = `translate3d(${viewportX}px, ${viewportY}px, 0) scale(${viewportZoom})`;
    if (fabricCanvas) {
      const handleSize = getScreenFriendlyCornerSize();
      fabricCanvas.getObjects().forEach(obj => {
        obj.set({ cornerSize: handleSize, touchCornerSize: handleSize });
        obj.setCoords();
      });
      fabricCanvas.requestRenderAll();
    }
  }

  function setupViewportGestures() {
    container.addEventListener('mousedown', (e) => {
      if(e.button === 1 || currentTool === 'pan' || e.target.id === 'viewportContainer') {
        isPanning = true;
        panStart = { x: e.clientX - viewportX, y: e.clientY - viewportY };
      } else {
        handleStagePointerDown(e);
      }
    });
    
    container.addEventListener('mousemove', (e) => {
      if(isPanning) {
        viewportX = e.clientX - panStart.x;
        viewportY = e.clientY - panStart.y;
        applyViewportTransform();
      } else {
        handleStagePointerMove(e);
      }
    });
    
    window.addEventListener('mouseup', () => {
      isPanning = false;
      handleStagePointerUp();
    });
    
    container.addEventListener('touchstart', (e) => {
      if(e.touches.length === 2) {
        isPanning = false;
        initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialZoom = viewportZoom;
      } else if(e.touches.length === 1) {
        handleStagePointerDown(e);
      }
    }, {passive: false});
    
    container.addEventListener('touchmove', (e) => {
      if(e.touches.length === 2) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const factor = dist / initialDistance;
        viewportZoom = Math.max(0.1, Math.min(10, initialZoom * factor));
        applyViewportTransform();
        e.preventDefault();
      } else if(e.touches.length === 1) {
        handleStagePointerMove(e);
      }
    }, {passive: false});
    
    container.addEventListener('touchend', (e) => {
      handleStagePointerUp();
    });
    
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.1;
      if (e.deltaY < 0) viewportZoom = Math.min(10, viewportZoom * zoomFactor);
      else viewportZoom = Math.max(0.1, viewportZoom / zoomFactor);
      applyViewportTransform();
    }, {passive: false});
  }

  // ======================== FLOATING DRAGGABLE SYSTEM ========================
  function makePanelMovable(panelId, handleId) {
    const panel = document.getElementById(panelId);
    const handle = document.getElementById(handleId);
    let px = 0, py = 0;
    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag, {passive:false});

    function startDrag(e) {
      if(handleId === 'bottomToolbarFloating' && e.target.closest('.tool-icon')) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      px = clientX - panel.offsetLeft;
      py = clientY - panel.offsetTop;
      document.addEventListener('mousemove', drag);
      document.addEventListener('touchmove', drag, {passive:false});
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchend', stopDrag);
      if(e.cancelable) e.preventDefault();
    }

    function drag(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      panel.style.left = (clientX - px) + 'px';
      panel.style.top = (clientY - py) + 'px';
      panel.style.bottom = 'auto';
      panel.style.right = 'auto';
    }

    function stopDrag() {
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('touchmove', drag);
      document.removeEventListener('mouseup', stopDrag);
      document.removeEventListener('touchend', stopDrag);
    }
  }

  // ======================== IMPROVED SUBMENU SYSTEM ========================
  // ⑥ 欄外タップで即閉じ、同じトリガー再押下で閉じる多重ガード仕様
  function showSubmenu(items, left, top, triggerId = null) {
    if (activeSubmenu && activeSubmenuTriggerId === triggerId && triggerId !== null) {
      closeActiveSubmenu();
      return;
    }
    closeActiveSubmenu();
    
    activeSubmenuTriggerId = triggerId;
    const menu = document.createElement('div');
    menu.className = 'submenu';
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    
    items.forEach(it => {
      const btn = document.createElement('div');
      btn.className = 'submenu-item' + (it.danger ? ' danger' : '');
      btn.innerText = it.label;
      btn.onclick = (e) => {
        e.stopPropagation();
        it.action();
        closeActiveSubmenu();
      };
      menu.appendChild(btn);
    });
    document.body.appendChild(menu);
    activeSubmenu = menu;
    
    setTimeout(() => {
      window.addEventListener('click', closeActiveSubmenuOnOuterClick);
      window.addEventListener('touchstart', closeActiveSubmenuOnOuterClick);
    }, 10);
  }

  function closeActiveSubmenu() {
    if(activeSubmenu && activeSubmenu.parentNode) {
      activeSubmenu.parentNode.removeChild(activeSubmenu);
      activeSubmenu = null;
    }
    activeSubmenuTriggerId = null;
    window.removeEventListener('click', closeActiveSubmenuOnOuterClick);
    window.removeEventListener('touchstart', closeActiveSubmenuOnOuterClick);
  }

  function closeActiveSubmenuOnOuterClick(e) {
    if(activeSubmenu && !activeSubmenu.contains(e.target)) {
      closeActiveSubmenu();
    }
  }

  // ======================== LAYER PANEL VIEWS ========================
  // ③ 各 layer-item に 🗑️ ボタンを完全復活。アクティブ削除、最低1枚残し、確認対応
  function refreshLayerPanel() {
    const list = document.getElementById('layerListContainer');
    list.innerHTML = "";
    for(let i = paintLayers.length - 1; i >= 0; i--) {
      const l = paintLayers[i];
      const item = document.createElement('div');
      item.className = 'layer-item' + (i === activePaintLayerIndex ? ' selected' : '');
      item.innerHTML = `
        <div class="layer-row">
          <span class="layer-name" id="lblname-${l.id}"></span>
          <div class="layer-actions">
            <button class="layer-act-btn ${!l.visible?'active':''}" id="vis-${l.id}">${l.visible?'👁️':'👁️‍🗨️'}</button>
            <button class="layer-act-btn ${l.locked?'active':''}" id="lock-${l.id}">${l.locked?'🔒':'🔓'}</button>
            <button class="layer-act-btn danger" id="del-${l.id}">🗑️</button>
          </div>
        </div>
        <input type="range" class="opacity-slider" min="0" max="1" step="0.01" value="${l.opacity}" id="opac-${l.id}">
      `;
      list.appendChild(item);
      // プロジェクトファイル由来のレイヤー名をHTMLとして解釈させない
      item.querySelector(`#lblname-${l.id}`).textContent = l.name || 'レイヤー';
      
      item.querySelector(`#lblname-${l.id}`).onclick = () => {
        activePaintLayerIndex = i;
        refreshLayerPanel();
      };
      item.querySelector(`#vis-${l.id}`).onclick = () => {
        l.visible = !l.visible;
        renderAllPaintLayers();
        refreshLayerPanel();
        commitSystemState();
      };
      item.querySelector(`#lock-${l.id}`).onclick = () => {
        l.locked = !l.locked;
        refreshLayerPanel();
        commitSystemState();
      };
      // 🗑️削除ロジックのバインド
      item.querySelector(`#del-${l.id}`).onclick = () => {
        if (paintLayers.length <= 1) {
          showStatus("最低1枚のレイヤーが必要です");
          return;
        }
        if (confirm(`レイヤー「${l.name}」を削除しますか？`)) {
          if (l.canvas && l.canvas.parentNode) {
            l.canvas.parentNode.removeChild(l.canvas);
          }
          const deletedIndex = i;
          const previousActiveIndex = activePaintLayerIndex;
          paintLayers.splice(deletedIndex, 1);
          // 削除位置に応じて選択中レイヤーのindexを補正
          if (deletedIndex < previousActiveIndex) {
            activePaintLayerIndex = previousActiveIndex - 1;
          } else if (deletedIndex === previousActiveIndex) {
            activePaintLayerIndex = Math.min(deletedIndex, paintLayers.length - 1);
          }
          activePaintLayerIndex = Math.max(0, Math.min(activePaintLayerIndex, paintLayers.length - 1));
          renderAllPaintLayers();
          refreshLayerPanel();
          commitSystemState();
          showStatus("レイヤーを削除しました");
        }
      };
      item.querySelector(`#opac-${l.id}`).oninput = (e) => {
        l.opacity = parseFloat(e.target.value);
        renderAllPaintLayers();
        commitSystemState();
      };
    }
  }

  function mergeActiveLayerDown() {
    if (activePaintLayerIndex <= 0) {
      showStatus("これ以上下のレイヤーはありません");
      return;
    }
    const topIndex = activePaintLayerIndex;
    const topLayer = paintLayers[topIndex];
    const bottomLayer = paintLayers[topIndex - 1];

    // 2枚を透明な一時キャンバス上で、それぞれの表示状態・不透明度を反映して合成する。
    // 合成結果を不透明度1の下レイヤーへ格納し、さらに下のレイヤーとの見た目を維持する。
    const mergedCanvas = document.createElement('canvas');
    mergedCanvas.width = CANVAS_W;
    mergedCanvas.height = CANVAS_H;
    const mergedCtx = mergedCanvas.getContext('2d');
    if (!mergedCtx) {
      showStatus("レイヤー結合用のキャンバスを作成できませんでした");
      return;
    }
    if (bottomLayer.visible && bottomLayer.opacity > 0) {
      mergedCtx.globalAlpha = bottomLayer.opacity;
      mergedCtx.drawImage(bottomLayer.canvas, 0, 0);
    }
    if (topLayer.visible && topLayer.opacity > 0) {
      mergedCtx.globalAlpha = topLayer.opacity;
      mergedCtx.drawImage(topLayer.canvas, 0, 0);
    }
    mergedCtx.globalAlpha = 1;

    bottomLayer.ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    bottomLayer.ctx.globalAlpha = 1;
    bottomLayer.ctx.drawImage(mergedCanvas, 0, 0);
    bottomLayer.opacity = 1;
    bottomLayer.visible = bottomLayer.visible || topLayer.visible;

    if (topLayer.canvas && topLayer.canvas.parentNode) {
      topLayer.canvas.parentNode.removeChild(topLayer.canvas);
    }
    paintLayers.splice(topIndex, 1);
    activePaintLayerIndex = topIndex - 1;

    renderAllPaintLayers();
    refreshLayerPanel();
    commitSystemState();
    showStatus("レイヤーを結合しました");
  }

  // ======================== V ⑤ 全消去修正・完全初期化 ========================
  function executeFullClearAllSystem() {
    if (!confirm("手書き、オブジェクト、背景を含むすべての描画内容を完全に消去しますか？")) return;
    
    // 1. 手書きレイヤーの完全クリア
    paintLayers.forEach(l => {
      l.ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    });
    
    // 2. Fabricオブジェクトの全消去
    if (fabricCanvas) {
      isApplyingHistory = true;
      fabricCanvas.clear();
      isApplyingHistory = false;
    }
    
    // 3. 背景画像参照を破棄・白塗りリセット
    bgImageElement = null;
    bgVisible = true;
    renderBackground();
    
    // 4. 履歴にコミットして状態リフレッシュ
    commitSystemState();
    refreshLayerPanel();
    if(fabricCanvas) fabricCanvas.renderAll();
    showStatus("完全初期状態にクリアしました");
  }

  // ======================== EXPORT SYSTEM ========================
  // ⑨ JPG出力の追加実装、白背景の自動合成対応
  function exportCanvasImage(formatType = 'png') {
    const outCanvas = document.createElement('canvas');
    outCanvas.width = CANVAS_W;
    outCanvas.height = CANVAS_H;
    const outCtx = outCanvas.getContext('2d');
    
    if (formatType === 'jpeg' || bgVisible) {
      if (bgImageElement) {
        let scale = Math.max(CANVAS_W / bgImageElement.width, CANVAS_H / bgImageElement.height);
        let w = bgImageElement.width * scale;
        let h = bgImageElement.height * scale;
        outCtx.drawImage(bgImageElement, (CANVAS_W - w)/2, (CANVAS_H - h)/2, w, h);
      } else {
        outCtx.fillStyle = '#ffffff';
        outCtx.fillRect(0,0,CANVAS_W,CANVAS_H);
      }
    }
    
    compositeAllPaintLayers(outCtx);
    
    if (fabricCanvas) {
      const tempImg = new Image();
      tempImg.onload = () => {
        outCtx.drawImage(tempImg, 0, 0);
        triggerDownload(outCanvas.toDataURL(formatType === 'jpeg' ? 'image/jpeg' : 'image/png', 0.92), formatType);
      };
      tempImg.src = fabricCanvas.toDataURL({ format: 'png' });
    } else {
      triggerDownload(outCanvas.toDataURL(formatType === 'jpeg' ? 'image/jpeg' : 'image/png', 0.92), formatType);
    }
  }

  function triggerDownload(dataUrl, formatType) {
    const a = document.createElement('a');
    a.download = 'pendraw_export_' + Date.now() + '.' + (formatType === 'jpeg' ? 'jpg' : 'png');
    a.href = dataUrl;
    a.click();
    showStatus(`${formatType.toUpperCase()}画像を出力しました`);
  }

                applySelectableProps(selRect); fabricCanvas.add(selRect); fabricCanvas.setActiveObject(selRect);
            }},
            { label: '⚪ 円形ガイドを配置', action: () => {
                setTool('select'); showStatus("円形ガイドを配置しました");
                let c = getCanvasCenterCoordinates();
                let selCircle = new fabric.Circle({ left: c.x-100, top: c.y-100, radius: 100, fill: 'rgba(0, 122, 255, 0.1)', stroke: '#007aff', strokeWidth: 2, strokeDashArray: [6, 4], name: 'selection_region' });
                applySelectableProps(selCircle); fabricCanvas.add(selCircle); fabricCanvas.setActiveObject(selCircle);
            }},
            { label: '〰️ 投げ縄選択 [未実装]', action: () => { showStatus("投げ縄選択は今後のバージョンで提供されます"); } },
            { label: '🧲 マグネット選択 [未実装]', action: () => { showStatus("マグネット選択は今後のバージョンで提供されます"); } }
          ], r.left, r.top - 180, 'select_menu');
        } else {
          setTool(tool);
        }
      };
    });

    // ⑦ 各ツール長押しで brushSizeMenu 表示（✏️, 🧽, 📏 すべての描画系に対応）
    document.querySelectorAll('.tool-icon').forEach(btn => {
      let timer = null;
      const triggerSize = () => {
        const t = btn.dataset.tool;
        if(t === 'draw' || t === 'shape_union' || currentTool === 'line') {
          let r = btn.getBoundingClientRect();
          brushSizeMenu.classList.remove('hidden');
          brushSizeMenu.style.left = r.left + 'px';
          brushSizeMenu.style.top = (r.top - 110) + 'px';
        }
      };
      
      btn.addEventListener('touchstart', () => { timer = setTimeout(triggerSize, 500); });
      btn.addEventListener('touchend', () => { clearTimeout(timer); });
      btn.addEventListener('mousedown', () => { timer = setTimeout(triggerSize, 500); });
      btn.addEventListener('mouseup', () => { clearTimeout(timer); });
    });

    // ======================== TEXT MODEL CONFIRM BIND ========================
    document.getElementById('btnConfirmText').onclick = () => {
      const txt = document.getElementById('modalTextarea').value;
      if(!txt && !isEditingText) {
        document.getElementById('textEditModal').classList.remove('active');
        return;
      }
      
      const isBold = document.getElementById('chkTextBold').checked;
      const hasStroke = document.getElementById('chkTextStroke').checked;
      
      if(isEditingText && currentEditingTargetObject) {
        currentEditingTargetObject.set({
          text: txt,
          fontFamily: modalSelectedFont,
          fontSize: modalSelectedSize,
          fontWeight: isBold ? 'bold' : 'normal',
          stroke: hasStroke ? brushColor : null,
          strokeWidth: hasStroke ? 2 : 0
        });
        fabricCanvas.renderAll();
      } else {
        setTool('select');
        let c = getCanvasCenterCoordinates();
        let fText = new fabric.IText(txt, {
          left: c.x - 100,
          top: c.y - 30,
          fontFamily: modalSelectedFont,
          fontSize: modalSelectedSize,
          fill: brushColor,
          fontWeight: isBold ? 'bold' : 'normal',
          stroke: hasStroke ? '#000000' : null,
          strokeWidth: hasStroke ? 2 : 0
        });
        applySelectableProps(fText);
        fabricCanvas.add(fText);
        fabricCanvas.setActiveObject(fText);
      }
      document.getElementById('textEditModal').classList.remove('active');
      isEditingText = false;
      currentEditingTargetObject = null;
      commitSystemState();
    };
    
    document.getElementById('btnCancelText').onclick = () => {
      document.getElementById('textEditModal').classList.remove('active');
      isEditingText = false;
      currentEditingTargetObject = null;
    };

    document.querySelectorAll('.font-btn').forEach(fb => {
      fb.onclick = () => {
        document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
        fb.classList.add('active');
        modalSelectedFont = fb.dataset.font;
      };
    });

    document.getElementById('btnSizePlus').onclick = () => { modalSelectedSize += 4; document.getElementById('lblTextSize').innerText = modalSelectedSize; };
    document.getElementById('btnSizeMinus').onclick = () => { if(modalSelectedSize > 8) modalSelectedSize -= 4; document.getElementById('lblTextSize').innerText = modalSelectedSize; };

    // ======================== HUD ACTION BINDINGS ========================
    const applyHudScale = () => {
      const act = fabricCanvas && fabricCanvas.getActiveObject();
      const input = document.getElementById('hudScaleInput');
      if (!act || !input) return;
      let percent = Number(input.value);
      if (!Number.isFinite(percent)) {
        showStatus('倍率を数値で入力してください');
        return;
      }
      percent = Math.max(1, Math.min(2000, percent));
      input.value = String(percent);
      const scale = percent / 100;
      act.set({ scaleX: scale, scaleY: scale });
      act.setCoords();
      fabricCanvas.requestRenderAll();
      commitSystemState();
      showStatus(`倍率を ${percent}% に設定`);
    };
    document.getElementById('hudScaleApply').onclick = applyHudScale;
    document.getElementById('hudScaleInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        applyHudScale();
      }
    });
    document.getElementById('hudBtnEdit').onclick = () => {
      let act = fabricCanvas.getActiveObject();
      if(!isTextObject(act)) return;
      isEditingText = true;
      currentEditingTargetObject = act;
      modalSelectedFont = act.fontFamily || 'sans-serif';
      modalSelectedSize = act.fontSize || 48;
      document.getElementById('textModalTitle').innerText = "テキスト再編集";
      document.getElementById('modalTextarea').value = act.text;
      document.getElementById('lblTextSize').innerText = modalSelectedSize;
      document.getElementById('chkTextBold').checked = act.fontWeight === 'bold';
      document.getElementById('chkTextStroke').checked = !!act.stroke;
      document.querySelectorAll('.font-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.font === modalSelectedFont);
      });
      document.getElementById('textEditModal').classList.add('active');
    };

    document.getElementById('hudBtnSizePlus').onclick = () => {
      let act = fabricCanvas.getActiveObject();
      if(act) { act.set('fontSize', (act.fontSize || 24) + 4); fabricCanvas.renderAll(); commitSystemState(); }
    };
    document.getElementById('hudBtnSizeMinus').onclick = () => {
      let act = fabricCanvas.getActiveObject();
      if(act && act.fontSize > 6) { act.set('fontSize', act.fontSize - 4); fabricCanvas.renderAll(); commitSystemState(); }
    };
    document.getElementById('hudBtnBold').onclick = () => {
      let act = fabricCanvas.getActiveObject();
      if(act) { const fw = act.fontWeight === 'bold' ? 'normal' : 'bold'; act.set('fontWeight', fw); fabricCanvas.renderAll(); commitSystemState(); }
    };
    document.getElementById('hudBtnStroke').onclick = () => {
      let act = fabricCanvas.getActiveObject();
      if(act) { const hasStr = !!act.stroke; act.set({ stroke: hasStr ? null : '#000000', strokeWidth: hasStr ? 0 : 2 }); fabricCanvas.renderAll(); commitSystemState(); }
    };

    // ⑩ 回転ツール追加実装：角度入力モーダル及びプリセットバインド
    document.getElementById('hudBtnRotate').onclick = () => {
      let act = fabricCanvas.getActiveObject();
      if(!act) return;
      document.getElementById('objectRotateModal').classList.add('active');
    };
    
    document.getElementById('btnCancelRotate').onclick = () => {
      document.getElementById('objectRotateModal').classList.remove('active');
    };
    
    document.getElementById('btnConfirmRotate').onclick = () => {
      let act = fabricCanvas.getActiveObject();
      let angle = parseFloat(document.getElementById('rotateAngleInput').value) || 0;
      if(act) {
        act.rotate((act.angle || 0) + angle);
        fabricCanvas.renderAll();
        commitSystemState();
        showStatus(`オブジェクトを ${angle}° 回転しました`);
      }
      document.getElementById('objectRotateModal').classList.remove('active');
    };
    
    // 回転プリセットボタン
    document.getElementById('rotPresetP1').onclick = () => { document.getElementById('rotateAngleInput').value = 1; };
    document.getElementById('rotPresetM1').onclick = () => { document.getElementById('rotateAngleInput').value = -1; };
    document.getElementById('rotPreset90').onclick = () => { document.getElementById('rotateAngleInput').value = 90; };
    document.getElementById('rotPreset180').onclick = () => { document.getElementById('rotateAngleInput').value = 180; };

    // ⑪ 境界ぼかし（フェザー）HUD機能追加：Fabric shadowを利用して実装
    document.getElementById('hudBtnFeather').onclick = (e) => {
      let act = fabricCanvas.getActiveObject();
      if(!act) return;
      let r = e.target.getBoundingClientRect();
      showSubmenu([
        { label: '🪶 ぼかし: なし (0)', action: () => { act.set('shadow', null); fabricCanvas.renderAll(); commitSystemState(); } },
        { label: '🪶 ぼかし: 小 (4)', action: () => { act.set('shadow', new fabric.Shadow({color: brushColor, blur: 4, offsetX: 0, offsetY: 0})); fabricCanvas.renderAll(); commitSystemState(); } },
        { label: '🪶 ぼかし: 中 (8)', action: () => { act.set('shadow', new fabric.Shadow({color: brushColor, blur: 8, offsetX: 0, offsetY: 0})); fabricCanvas.renderAll(); commitSystemState(); } },
        { label: '🪶 ぼかし: 大 (16)', action: () => { act.set('shadow', new fabric.Shadow({color: brushColor, blur: 16, offsetX: 0, offsetY: 0})); fabricCanvas.renderAll(); commitSystemState(); } },
        { label: '🪶 ぼかし: 極大 (32)', action: () => { act.set('shadow', new fabric.Shadow({color: brushColor, blur: 32, offsetX: 0, offsetY: 0})); fabricCanvas.renderAll(); commitSystemState(); } }
      ], r.left, r.top - 180, 'hudFeather');
    };

    document.getElementById('hudBtnClone').onclick = () => {
      let act = fabricCanvas.getActiveObject(); if(!act) return;
      act.clone((cloned) => {
        cloned.set({ left: cloned.left + 40, top: cloned.top + 40 });
        applySelectableProps(cloned); fabricCanvas.add(cloned); fabricCanvas.setActiveObject(cloned);
      });
    };
    document.getElementById('hudBtnDelete').onclick = () => {
      let act = fabricCanvas.getActiveObject();
      if(act){ fabricCanvas.remove(act); fabricCanvas.discardActiveObject().renderAll(); }
    };

    // LAYER DRAWER TOP BINDS
    document.getElementById('closeLayerDrawer').onclick = () => document.getElementById('layerDrawer').classList.remove('open');
    document.getElementById('layerAddBtn').onclick = () => { createPaintLayer("ペン描画層 " + (paintLayers.length + 1)); };
    document.getElementById('layerMergeBtn').onclick = () => mergeActiveLayerDown();
    
    refreshLayerPanel();

    // ======================== V ⑬ DIRECTION & VIEWPORT SYSTEM ========================
    const step = 30;
    // D-pad: オブジェクト選択中はオブジェクトを移動、未選択時は表示位置を移動
    let dpadObjectMoved = false;
    const finishDpadMove = () => {
      clearInterval(dpadInterval);
      dpadInterval = null;
      if (dpadObjectMoved) {
        dpadObjectMoved = false;
        commitSystemState();
      }
    };
    const runDpad = (dir) => {
      if (dir === 'center') { fitToScreen(); return; }
      const dx = (dir.includes('right') || dir === 'right') ? step :
                 (dir.includes('left') || dir === 'left') ? -step : 0;
      const dy = (dir.includes('down') || dir === 'down') ? step :
                 (dir.includes('up') || dir === 'up') ? -step : 0;
      const activeObj = fabricCanvas && fabricCanvas.getActiveObject();
      if (activeObj && activeObj.selectable !== false) {
        activeObj.set({ left: (activeObj.left || 0) + dx, top: (activeObj.top || 0) + dy });
        activeObj.setCoords();
        fabricCanvas.requestRenderAll();
        dpadObjectMoved = true;
      } else {
        viewportX += dx;
        viewportY += dy;
        applyViewportTransform();
      }
    };

    document.querySelectorAll('[data-dir]').forEach(b => {
      b.addEventListener('mousedown', () => {
        finishDpadMove();
        runDpad(b.dataset.dir);
        dpadInterval = setInterval(() => runDpad(b.dataset.dir), 100);
      });
      b.addEventListener('touchstart', (e) => {
        e.preventDefault();
        finishDpadMove();
        runDpad(b.dataset.dir);
        dpadInterval = setInterval(() => runDpad(b.dataset.dir), 100);
      }, {passive: false});
    });
    window.addEventListener('mouseup', finishDpadMove);
    window.addEventListener('touchend', finishDpadMove);
    window.addEventListener('touchcancel', finishDpadMove);

    // ② D-pad中央ボタン（🟢）長押しサブメニュー構造の実装
    const centerBtn = document.querySelector('.dpad-btn.center-btn');
    let centerLongPressTimer = null;
    
    const triggerDpadLongPressMenu = (e) => {
      let r = centerBtn.getBoundingClientRect();
      showSubmenu([
        { label: '🙈 D-padを隠す', danger: true, action: () => {
            document.getElementById('movableDpad').style.display = 'none';
            showStatus("D-padを非表示にしました (表示メニューから再開可能)");
        }}
      ], r.left - 40, r.top - 46, 'dpadCenter');
    };
    
    centerBtn.addEventListener('mousedown', () => { centerLongPressTimer = setTimeout(triggerDpadLongPressMenu, 600); });
    centerBtn.addEventListener('mouseup', () => { clearTimeout(centerLongPressTimer); });
    centerBtn.addEventListener('touchstart', (e) => { centerLongPressTimer = setTimeout(triggerDpadLongPressMenu, 600); });
    centerBtn.addEventListener('touchend', () => { clearTimeout(centerLongPressTimer); });
  });
</script>

<script>
  // PWA: HTTPS環境でService Workerを登録
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('PWA Service Worker registration failed:', err));
    });
  }
</script>

</body>
